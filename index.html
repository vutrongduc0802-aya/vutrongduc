<!-- Mình sẽ giữ nguyên toàn bộ chức năng, chỉ bổ sung dữ liệu vào biến list trong script -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng điểm sinh viên</title>
<style>
body{font-family:Arial;background:#eef1f5;padding:20px}
.container{max-width:1200px;margin:auto;background:white;padding:25px;border-radius:10px}
h2{text-align:center;margin-bottom:20px}
.section-title{margin-top:30px;font-size:20px;font-weight:bold;padding-bottom:5px;border-bottom:2px solid #3b6bbf;color:#244a8f}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
input{padding:10px;border-radius:6px;border:1px solid #aaa;width:100%}
button{padding:10px;border-radius:8px;border:none;cursor:pointer;background:#3b6bbf;color:white;font-weight:bold;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:15px}
th,td{border:1px solid #bbb;padding:8px;text-align:center}
th{background:#e8eaf0}
.delete{background:red;padding:6px 10px;border-radius:5px;color:white;border:none;cursor:pointer}
#info{background:#f4f6fa;padding:15px;border-radius:8px;font-size:17px;line-height:1.6;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h2>BẢNG ĐIỂM SINH VIÊN</h2>
<div class="section-title">1. Thông tin sinh viên</div>
<div class="form">
<input id="masv" placeholder="Mã sinh viên" oninput="saveStudent()">
<input id="hoten" placeholder="Họ và tên" oninput="saveStudent()">
<input id="lop" placeholder="Lớp" oninput="saveStudent()">
<input id="covan" placeholder="Cố vấn học tập" oninput="saveStudent()">
</div>
<div id="info"></div>

<div class="section-title">2. Bảng điểm chi tiết</div>
<div class="form">
<input id="mon" placeholder="Môn thi">
<input id="hocky" placeholder="Học kỳ (VD: HK1)">
<input id="sotinchi" type="number" placeholder="Số tín chỉ">
<input id="cc" type="number" placeholder="Điểm chuyên cần">
<input id="kt" type="number" placeholder="Điểm kiểm tra">
<input id="ck1" type="number" placeholder="Điểm thi lần 1">
<input id="ck2" type="number" placeholder="Điểm thi lần 2">
<input id="ngay" type="date">
<input id="ghichu" placeholder="Ghi chú (Nếu có)">
</div>
<button onclick="add()">➕ Thêm môn</button>

<table>
<thead>
<tr>
<th>STT</th>
<th>Môn thi</th>
<th>Học kỳ</th>
<th>Số TC</th>
<th>CC</th>
<th>KT</th>
<th>Thi L1</th>
<th>Thi L2</th>
<th>Điểm 10</th>
<th>Điểm chữ</th>
<th>Điểm HP</th>
<th>Ngày công bố</th>
<th>Ghi chú</th>
<th>Xóa</th>
</tr>
</thead>
<tbody id="data"></tbody>
</table>
</div>

<script>
// ======== DỮ LIỆU ĐIỂM THEO ẢNH ========
let list = [
    {mon:"Ngữ văn Hán Nôm 1",hocky:"HK5",tc:3,cc:8,kt:8,ck1:7.2,ck2:"",d10:7.2,dchu:"B",dhp:3,ngay:"29/12/2025",ghichu:""},
    {mon:"Thực hành thường xuyên",hocky:"HK5",tc:4,cc:1,kt:0,ck1:"",ck2:"",d10:"",dchu:"",dhp:"",ngay:"",ghichu:""},
    {mon:"Nhập môn trí tuệ nhân tạo",tc:4,cc:10,kt:10,ck1:9.4,ck2:"",d10:9.4,dchu:"A",dhp:4,ngay:"22/07/2025",ghichu:""},
    {mon:"Lập trình nâng cao",tc:4,cc:9,kt:8,ck1:8.5,d10:8.5,dchu:"A",dhp:4,ngay:"22/06/2025",ghichu:""},
    {mon:"An toàn và bảo mật thông tin",tc:4,cc:9.5,kt:9,ck1:8.9,d10:8.9,dchu:"A",dhp:4,ngay:"20/06/2025",ghichu:""},
    {mon:"Ngôn ngữ mô hình hóa UML",tc:4,cc:10,kt:10,ck1:9.8,d10:9.8,dchu:"A",dhp:4,ngay:"30/05/2025",ghichu:""},
    {mon:"Quản trị mạng",tc:4,cc:9,kt:9,ck1:9,d10:9,dchu:"A",dhp:4,ngay:"16/06/2025",ghichu:""},
    {mon:"Tư tưởng Hồ Chí Minh",tc:4,cc:10,kt:7.5,ck1:8.3,d10:8.3,dchu:"B",dhp:3,ngay:"17/06/2025",ghichu:""},
    {mon:"Lập trình hướng đối tượng",tc:4,cc:10,kt:9.5,ck1:9.9,d10:9.9,dchu:"A",dhp:4,ngay:"25/06/2025",ghichu:""},
    {mon:"Kỹ nghệ phần mềm",tc:5,cc:9.5,kt:9.5,ck1:9.5,d10:9.5,dchu:"A",dhp:4,ngay:"27/12/2025",ghichu:""}
    {mon:"Ngữ văn Hán Nôm 1",hocky:"HK1",tc:3,cc:8,kt:8.8,ck1:6,ck2:"",d10:7.2,dchu:"B",dhp:3,ngay:"29/12/2025",ghichu:""},
    {mon:"Thực hành thường xuyên",hocky:"HK1",tc:4,cc:1,kt:"",ck1:"",ck2:"",d10:"()",dchu:"",dhp:"",ngay:"",ghichu:""},
    {mon:"Nhập môn trí tuệ nhân tạo",hocky:"HK1",tc:4,cc:10,kt:10,ck1:8.8,ck2:"",d10:9.4,dchu:"A",dhp:4,ngay:"22/07/2025",ghichu:""},
    {mon:"Lập trình nâng cao",hocky:"HK1",tc:4,cc:9,kt:8,ck1:8.5,ck2:"",d10:8.5,dchu:"A",dhp:4,ngay:"22/06/2025",ghichu:""},
    {mon:"An toàn và bảo mật thông tin",hocky:"HK1",tc:4,cc:9.5,kt:9,ck1:8.5,ck2:"",d10:8.9,dchu:"A",dhp:4,ngay:"20/06/2025",ghichu:""},
    {mon:"Ngôn ngữ mô hình hóa UML",hocky:"HK1",tc:4,cc:10,kt:10,ck1:9.5,ck2:"",d10:9.8,dchu:"A",dhp:4,ngay:"30/05/2025",ghichu:""},
    {mon:"Quản trị mạng",hocky:"HK1",tc:4,cc:9,kt:9,ck1:9,ck2:"",d10:9,dchu:"A",dhp:4,ngay:"16/06/2025",ghichu:""},
    {mon:"Tư tưởng Hồ Chí Minh",hocky:"HK1",tc:4,cc:10,kt:7.5,ck1:8,ck2:"",d10:8.3,dchu:"B",dhp:3,ngay:"17/06/2025",ghichu:""},
    {mon:"Lập trình hướng đối tượng",hocky:"HK1",tc:4,cc:10,kt:9.5,ck1:10,ck2:"",d10:9.9,dchu:"A",dhp:4,ngay:"25/06/2025",ghichu:""},
    {mon:"Kỹ nghệ phần mềm",hocky:"HK1",tc:5,cc:9.5,kt:9.5,ck1:9.5,ck2:"",d10:9.5,dchu:"A",dhp:4,ngay:"27/12/2025",ghichu:""}
];

let student = JSON.parse(localStorage.getItem("sinhvien")) || {masv:"",hoten:"",lop:"",covan:""};

function renderInfo(){
    document.getElementById("info").innerHTML = `<b>Mã sinh viên:</b> ${student.masv}<br>
    <b>Họ và tên:</b> ${student.hoten}<br>
    <b>Lớp:</b> ${student.lop}<br>
    <b>Cố vấn học tập:</b> ${student.covan}`;
}

function saveStudent(){
    student={masv:masv.value,hoten:hoten.value,lop:lop.value,covan:covan.value};
    localStorage.setItem("sinhvien",JSON.stringify(student));
    renderInfo();
}

window.onload=()=>{
    masv.value=student.masv;
    hoten.value=student.hoten;
    lop.value=student.lop;
    covan.value=student.covan;
    renderInfo();
    render();
};

function render(){
    const tbody=document.getElementById("data");
    tbody.innerHTML="";
    list.forEach((r,i)=>{
        tbody.innerHTML+=`
        <tr>
            <td>${i+1}</td>
            <td>${r.mon}</td>
            <td>${r.hocky||""}</td>
            <td>${r.tc}</td>
            <td>${r.cc}</td>
            <td>${r.kt}</td>
            <td>${r.ck1}</td>
            <td>${r.ck2||""}</td>
            <td>${r.d10}</td>
            <td>${r.dchu}</td>
            <td>${r.dhp}</td>
            <td>${r.ngay}</td>
            <td>${r.ghichu}</td>
            <td><button class="delete" onclick="remove(${i})">Xóa</button></td>
        </tr>`;
    });
    localStorage.setItem("bangdiem",JSON.stringify(list));
}

function add(){
    let ckFinal=ck2.value?ck2.value:ck1.value;
    let d10=(Math.round((cc.value*0.2+kt.value*0.3+ckFinal*0.5)*10)/10).toFixed(1);
    let dchu = d10>=8.5?"A":d10>=7?"B":d10>=5.5?"C":d10>=4?"D":"F";
    let dhp={A:4,B:3,C:2,D:1,F:0}[dchu];

    list.push({
        mon:mon.value,hocky:hocky.value,tc:sotinchi.value,cc:cc.value,kt:kt.value,ck1:ck1.value,ck2:ck2.value,
        d10,dchu,dhp,ngay:ngay.value.split('-').reverse().join('/'),ghichu:ghichu.value
    });
    render();
    document.querySelectorAll("input").forEach(i=>i.value="");
}
function remove(i){list.splice(i,1);render();}
// ========= THÊM DỮ LIỆU MẪU =========
list = [
    {mon:"Ngữ văn Hán Nôm 1",hocky:"HK1",tc:3,cc:8,kt:8.8,ck1:6,ck2:"",d10:7.2,dchu:"B",dhp:3,ngay:"29/12/2025",ghichu:""},
    {mon:"Thực hành thường xuyên",hocky:"HK1",tc:4,cc:1,kt:"",ck1:"",ck2:"",d10:"()",dchu:"",dhp:"",ngay:"",ghichu:""},
    {mon:"Nhập môn trí tuệ nhân tạo",hocky:"HK1",tc:4,cc:10,kt:10,ck1:8.8,ck2:"",d10:9.4,dchu:"A",dhp:4,ngay:"22/07/2025",ghichu:""},
    {mon:"Lập trình nâng cao",hocky:"HK1",tc:4,cc:9,kt:8,ck1:8.5,ck2:"",d10:8.5,dchu:"A",dhp:4,ngay:"22/06/2025",ghichu:""},
    {mon:"An toàn và bảo mật thông tin",hocky:"HK1",tc:4,cc:9.5,kt:9,ck1:8.5,ck2:"",d10:8.9,dchu:"A",dhp:4,ngay:"20/06/2025",ghichu:""},
    {mon:"Ngôn ngữ mô hình hóa UML",hocky:"HK1",tc:4,cc:10,kt:10,ck1:9.5,ck2:"",d10:9.8,dchu:"A",dhp:4,ngay:"30/05/2025",ghichu:""},
    {mon:"Quản trị mạng",hocky:"HK1",tc:4,cc:9,kt:9,ck1:9,ck2:"",d10:9,dchu:"A",dhp:4,ngay:"16/06/2025",ghichu:""},
    {mon:"Tư tưởng Hồ Chí Minh",hocky:"HK1",tc:4,cc:10,kt:7.5,ck1:8,ck2:"",d10:8.3,dchu:"B",dhp:3,ngay:"17/06/2025",ghichu:""},
    {mon:"Lập trình hướng đối tượng",hocky:"HK1",tc:4,cc:10,kt:9.5,ck1:10,ck2:"",d10:9.9,dchu:"A",dhp:4,ngay:"25/06/2025",ghichu:""},
    {mon:"Kỹ nghệ phần mềm",hocky:"HK1",tc:5,cc:9.5,kt:9.5,ck1:9.5,ck2:"",d10:9.5,dchu:"A",dhp:4,ngay:"27/12/2025",ghichu:""}
];

render();
</script>
</body>
</html>
